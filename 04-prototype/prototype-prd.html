<style>
:root{
  --primary:#165dff;--primary-dark:#0e42d2;--text:#1d2129;--muted:#4e5969;
  --border:#e5e6eb;--bg:#f7f8fa;--success:#00b42a;--warning:#ff7d00;--danger:#f53f3f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--text);background:var(--bg);
  font:13px/1.6 "PingFang SC","Microsoft YaHei",system-ui}
button{font-family:inherit}
.app{display:flex;flex-direction:column;height:100vh}

/* ---------- 两栏：左原型 + 右 PRD 并排（无独立标题栏 / 无独立导航） ---------- */
.body{flex:1;display:flex;min-height:0}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
/* iframe 100% 铺满舞台容器：不做任何等比缩小、不加外框、不加灰底、不加顶部 padding，
   原型完全按自身 scaleStage() 与 #viewport 居中机制渲染（等同独立打开 index.html）。
   顶栏裁切的根因是 iframe src 带 #page-overview 锚点触发 #stage 滚动（实测 scrollTop=22），
   已通过「去掉 hash + 注入 #stage{overflow:clip}」根治，无需任何布局补丁。 */
.viewport{flex:1;overflow:hidden;background:#EAF3FF;padding:0;position:relative}
.framewrap{position:absolute;inset:0;background:transparent;overflow:hidden}
.framewrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ---------- 右侧 PRD 面板 ---------- */
.prd{flex:0 0 400px;width:400px;border-left:1px solid var(--border);background:#fff;display:flex;flex-direction:column;min-height:0}
.app.prd-off .prd{display:none}
.prd-head{padding:12px 16px 10px;border-bottom:1px solid var(--border)}
.prd-head .line1{display:flex;align-items:center;gap:8px}
.prd-head h3{margin:0;font-size:15px}
.prd-id{font:600 11px/18px Inter,system-ui;background:#e8f3ff;color:var(--primary);padding:0 7px;border-radius:5px}
.prd-head .line2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;line-height:18px;
  background:#f2f3f5;color:var(--muted)}
.chip.blue{background:#e8f3ff;color:var(--primary)}
.prd-body{flex:1;overflow:auto;padding:14px 16px 28px}
.prd-sec{margin-bottom:16px}
.prd-sec h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--primary);
  border-left:3px solid var(--primary);padding-left:7px;line-height:1.4}
.prd-sec p{margin:0;font-size:12px;color:var(--muted)}
.prd-sec ul{margin:0;padding-left:16px}
.prd-sec li{font-size:12px;color:var(--muted);margin:3px 0}
.prd-sec table{width:100%;border-collapse:collapse;font-size:11px}
.prd-sec th,.prd-sec td{border:1px solid var(--border);padding:5px 7px;text-align:left;vertical-align:top}
.prd-sec th{background:var(--bg);color:var(--muted);font-weight:600}
.prd-sec code{font:11px/1.5 Consolas,monospace;color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips .chip.f{background:#e8f3ff;color:var(--primary)}
.chips .chip.r{background:#fff7e8;color:#d25f00}
.kv{display:grid;grid-template-columns:64px 1fr;gap:6px 10px;font-size:12px}
.kv dt{color:#86909c}
.kv dd{margin:0;color:var(--text)}
.map-row{cursor:pointer}
.map-row:hover td{background:#f2f7ff}
.map-row.on td{background:#e8f3ff}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;line-height:18px}
.tag.green{background:#e8ffea;color:#009a29}
.tag.orange{background:#fff7e8;color:#d25f00}
.tag.gray{background:#f2f3f5;color:#86909c}
.prd-note{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:11px;color:#86909c}
.prd-note b{color:var(--text)}
.prd-foot{padding:8px 16px;border-top:1px solid var(--border);font-size:11px;color:#a9aeb8;display:flex;gap:10px;align-items:center}
.prd-foot .spacer{flex:1}
.prd-foot a{color:var(--primary);text-decoration:none;cursor:pointer}
.prd-foot a:hover{text-decoration:underline}
/* 展开 PRD：仅在 PRD 收起态出现，位于原型顶栏下方图例区右端（不遮挡顶栏时钟 / 巡播 / 全屏控件）。
   收起 PRD：置于右侧 PRD 面板头部，PRD 可见时才出现；两个按钮各司其职、位置不随文字切换。 */
.prd-toggle{position:absolute;top:72px;right:5%;z-index:25;
  border:1px solid rgba(22,119,255,.35);background:rgba(255,255,255,.94);
  color:var(--primary);border-radius:6px;height:26px;padding:0 11px;
  font-size:11px;font-weight:600;cursor:pointer;
  box-shadow:0 2px 8px rgba(22,119,255,.14)}
.prd-toggle:hover{background:#e8f3ff;border-color:var(--primary)}
.app:not(.prd-off) .prd-toggle{display:none}
.prd-fold{margin-left:auto;flex:none;border:1px solid rgba(22,119,255,.35);background:#fff;
  color:var(--primary);border-radius:6px;height:24px;padding:0 10px;
  font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.prd-fold:hover{background:#e8f3ff;border-color:var(--primary)}
.global-ref{margin-top:14px;border-top:1px solid var(--border);padding-top:10px}
.global-ref summary{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer;list-style:none}
.global-ref summary::-webkit-details-marker{display:none}
.global-ref summary::before{content:"▸";margin-right:6px;font-size:10px}
.global-ref[open] summary::before{content:"▾"}
.global-ref .gr-body{padding-top:10px}
.global-ref h5{margin:12px 0 6px;font-size:11px;color:#86909c;font-weight:600}
.global-ref table{width:100%;border-collapse:collapse;font-size:11px}
.global-ref th,.global-ref td{border:1px solid var(--border);padding:5px 7px;text-align:left;vertical-align:top}
.global-ref th{background:var(--bg);color:var(--muted);font-weight:600}
.global-ref ul{margin:0;padding-left:16px}
.global-ref li{font-size:11px;color:var(--muted);margin:3px 0}

/* 联动高亮（原型内部注入） */
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,93,255,.35)}70%{box-shadow:0 0 0 6px rgba(22,93,255,0)}100%{box-shadow:0 0 0 0 rgba(22,93,255,0)}}
.hl{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px;animation:pulse 1.2s 2}
@media (max-width:1440px){.prd{flex-basis:360px;width:360px}}
</style>
</head>

/* ================= 渲染 ================= */
const $=s=>document.querySelector(s);
const app=$('#app'),prdHead=$('#prdHead'),prdBody=$('#prdBody');
const frame=$('#frame'),frameTasks=$('#frameTasks'),frameStatus=$('#frameStatus'),
      wrap=$('#framewrap'),viewport=$('#viewport');
const ALL_FRAMES=[frame,frameTasks,frameStatus];
let curIdx=0,hlEls=[];

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function renderPrd(){
  const p=PAGES[curIdx];
  prdHead.innerHTML=`<div class="line1"><h3>${p.name}</h3><span class="prd-id">${p.key}</span>
      <button class="prd-fold" id="prdFold">收起 PRD</button></div>
    <div class="line2"><span class="chip">${p.prd}</span><span class="chip blue">${p.id?'大屏页面':'管理侧'}</span></div>`;

  let h=`<div class="prd-sec"><h4>用户场景</h4><p>${p.scene}</p></div>`;
  h+=`<div class="prd-sec"><h4>功能点</h4><ul>${p.funcs.map(f=>`<li>${f}</li>`).join('')}</ul>
      <div class="chips" style="margin-top:8px">${p.funcs.map(f=>`<span class="chip f">${f.split(' ')[0]}</span>`).join('')}</div></div>`;
  h+=`<div class="prd-sec"><h4>业务规则</h4><div class="chips">${p.rules.map(r=>`<span class="chip r">${r}</span>`).join('')}</div></div>`;
  h+=`<div class="prd-sec"><h4>输入 / 输出</h4><dl class="kv"><dt>输入</dt><dd>${p.input}</dd><dt>输出</dt><dd>${p.output}</dd></dl></div>`;
  h+=`<div class="prd-sec"><h4>异常与边界</h4><p>${p.exception}</p></div>`;
  /* v1.5.1：每个模块独立 PRD 六要素（功能描述 / 展示内容 / 数据来源 / 统计规则 / 更新规则 / 异常与空值处理） */
  h+=`<div class="prd-sec"><h4>模块说明（v1.5.1 · 六要素）</h4><dl class="kv">
      <dt>功能描述</dt><dd>${p.scene}</dd>
      <dt>展示内容</dt><dd>${p.output}</dd>
      <dt>数据来源</dt><dd>${p.mod?p.mod.src:p.input}</dd>
      <dt>统计规则 / 口径</dt><dd>${p.mod?p.mod.stat:('按业务规则 '+(p.rules||[]).join(' / ')+' 执行；双口径并列不调平（R-01）')}</dd>
      <dt>更新规则及依据</dt><dd>${p.mod?p.mod.upd:'随 2026-11-16 快照重挂接同步；展示块更新频率取数据源中最高频目录（实时 > 每日 > 每月 > 每季 > 每年）'}</dd>
      <dt>异常与空值处理</dt><dd>${p.exception}</dd></dl></div>`;
  h+=`<div class="prd-sec"><h4>验收要点</h4><ul>${p.accept.map(a=>`<li>${a}</li>`).join('')}</ul></div>`;
  if(p.map&&p.map.length){
    h+=`<div class="prd-sec"><h4>元素映射</h4><table><tr><th>元素</th><th>选择器</th><th>PRD 要求</th></tr>
      ${p.map.map(m=>`<tr class="map-row" data-sel="${esc(m[1])}"><td>${m[0]}</td><td><code>${esc(m[1])}</code></td><td>${m[2]}</td></tr>`).join('')}</table></div>`;
  }
  /* 全站公共行为 / 五态口径 / R-xx 总表：随每页常驻的折叠区块，不占导航 */
  h+=`<details class="global-ref"><summary>全局口径参考（五态 · R-xx · 公共行为）</summary><div class="gr-body">
      <h5>五态口径</h5><table><tr><th>状态</th><th>状态名</th><th>原型实现</th><th>口径</th><th>验收</th></tr>
      ${STATES.map(s=>`<tr><td>${s[0]}</td><td><code>${s[1]}</code></td><td>${s[2]}</td><td>${s[3]}</td><td>${s[4]}</td></tr>`).join('')}</table>
      <div class="prd-note" style="margin-top:8px"><b>Mock 边界</b>：单文件静态内嵌数据（A-01），无网络层。loading / error 两态的骨架屏与真实网络错误演示属 Mock 范畴。</div>
      <h5>业务规则 R-01 – R-13</h5><table><tr><th>编号</th><th>规则</th><th>出处</th></tr>
      ${RULES.map(r=>`<tr><td><span class="chip blue">${r.id}</span></td><td>${r.text}</td><td>${r.src}</td></tr>`).join('')}</table>
      <h5>全站公共行为 F-038 – F-045</h5><ul>${GLOBAL_FUNCS.map(f=>`<li>${f}</li>`).join('')}</ul>
    </div></details>`;
  prdBody.innerHTML=h;
  prdBody.scrollTop=0;
  [...prdBody.querySelectorAll('.map-row')].forEach(tr=>{
    tr.onmouseenter=()=>highlight(tr.dataset.sel,true);
    tr.onmouseleave=()=>highlight(tr.dataset.sel,false);
  });
}
/* 三路 iframe 全部预加载：切页只做显隐，不重复导航（消除竞态） */
function activeFrame(){
  const p=PAGES[curIdx];
  if(p.mgmt)return p.mgmt.endsWith('page=status')?frameStatus:frameTasks;
  return frame;
}
function highlight(sel,on){
  clearHl();
  if(!sel||on===false)return;
  try{
    const doc=activeFrame().contentDocument;
    if(!doc||!doc.querySelectorAll)return;
    doc.querySelectorAll(sel).forEach(el=>{el.classList.add('hl');hlEls.push(el);});
  }catch(e){/* file:// 跨文档不可访问：静默降级 */}
}
function clearHl(){hlEls.forEach(el=>el.classList.remove('hl'));hlEls=[];}

/* 三路 iframe 全预加载，切页只显隐；iframe 100% 铺满容器（纯 CSS，不做任何尺寸计算），
   原型完全按自身 scaleStage() 与 #viewport 居中机制渲染，等同独立打开。
   【根因】此前 iframe src 带 #page-overview，浏览器把锚点元素滚进视口，
   令 #stage（overflow:hidden）产生 scrollTop≈22，顶栏上半部被裁掉、上方露出灰带。
   修复 = ① iframe src 去掉 hash；② 注入 #stage{overflow:clip} 使其不可滚动。
   不再注入任何 padding / 对齐 / 缩放原点 / scaleStage 补丁，也不改原型业务数据。 */
function ensureNoScroll(f){
  try{
    const d=f.contentDocument, stage=d&&d.getElementById('stage');
    if(!d||!d.head||!stage)return;
    if(!d.getElementById('__protoNoScroll')){
      const st=d.createElement('style');
      st.id='__protoNoScroll';
      /* clip 与 hidden 视觉一致但不可滚动，从根上杜绝锚点/焦点把顶栏滚出视口 */
      st.textContent='#stage{overflow:hidden!important;overflow:clip!important}';
      d.head.appendChild(st);
    }
    if(stage.scrollTop)stage.scrollTop=0;
  }catch(e){/* file:// 跨文档不可访问：静默降级 */}
}
function fit(){
  const show=activeFrame();
  ALL_FRAMES.forEach(f=>f.style.display=(f===show?'block':'none'));
  ensureNoScroll(frame); // 仅大屏原型有 #stage；管理侧两页保持自身布局
  /* PRD 展开/收起会改变 iframe 宽度，主动让原型自己重算一次缩放（不改其逻辑），
     避免虚拟时间 / 部分浏览器下 resize 事件未派发导致停留在上一状态的缩放值 */
  try{
    const w=frame.contentWindow;
    if(w&&typeof w.scaleStage==='function')w.scaleStage();
  }catch(e){/* file:// 降级 */}
}

/* ================= 切页联动 ================= */
function goto(i){
  clearHl();curIdx=i;renderPrd();
  const p=PAGES[i];
  if(p.mgmt){
    // 管理侧两个子页均为预加载 iframe，切页仅需 fit() 显隐，不做任何导航
  }else if(p.id){
    let ok=false;
    try{
      const w=frame.contentWindow;
      if(w&&typeof w.setPage==='function'&&w.document&&w.document.getElementById(p.id)){
        if(typeof w.stopTour==='function')w.stopTour();
        w.setPage(p.id);ok=true;
      }
    }catch(e){/* file:// */}
    if(!ok)frame.src=p.src; // 降级：hash 导航（原型 init + hashchange 支持）
  }
  fit();
}

/* iframe 加载完成后重新适配 */
ALL_FRAMES.forEach(f=>f.addEventListener('load',()=>{setTimeout(fit,80);}));

/* 原型内导航 → 反向高亮顶部对应页签 */
setInterval(()=>{
  try{
    const mg=!!PAGES[curIdx].mgmt;
    const doc=activeFrame().contentDocument;
    if(!doc||!doc.querySelector)return;
    if(mg){
      const mt=doc.querySelector('.tabs button.on');
      if(mt&&mt.dataset.page){
        const i=PAGES.findIndex(p=>p.mgmt&&p.mgmt.endsWith('page='+mt.dataset.page));
        if(i>=0&&i!==curIdx){curIdx=i;renderPrd();fit();}
      }
      return;
    }
    const act=doc.querySelector('.page.active');
    if(act){
      const i=PAGES.findIndex(p=>p.id===act.id);
      if(i>=0&&i!==curIdx){curIdx=i;renderPrd();fit();}
    }
  }catch(e){/* file:// 不可读：仅保留单向联动 */}
},500);

/* 收起 / 展开 PRD：两个按钮各司其职 ——
   「收起 PRD」在右侧 PRD 面板头部（PRD 可见时），「展开 PRD」在原型顶栏下方图例区右端（PRD 隐藏时）；
   管理侧入口为脚注链接 */
document.addEventListener('click',e=>{
  if(e.target.id==='prdToggle'||e.target.id==='prdFold'){
    app.classList.toggle('prd-off');
    setTimeout(fit,60);
  }
  const a=e.target.closest&&e.target.closest('.prd-foot a');
  if(a)goto(+a.dataset.i);
});
addEventListener('resize',fit);

/* 初始 */
renderPrd();fit();
</script>
